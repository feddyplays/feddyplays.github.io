        <script>
            function resizeGameCanvas() {
                const canvas = document.getElementById('canvas');
                if (!canvas) return;
                const size = Math.min(window.innerWidth, window.innerHeight);
                canvas.style.width = size + 'px';
                canvas.style.height = size + 'px';
            }

            const mobileControlKeys = {
                left: 37,
                up: 38,
                right: 39,
                down: 40,
                action: 90
            };

            const mobileKeyMap = {
                37: { key: 'ArrowLeft', code: 'ArrowLeft' },
                38: { key: 'ArrowUp', code: 'ArrowUp' },
                39: { key: 'ArrowRight', code: 'ArrowRight' },
                40: { key: 'ArrowDown', code: 'ArrowDown' },
                90: { key: 'z', code: 'KeyZ' }
            };

            function createKeyboardEvent(type, keyCode) {
                const mapping = mobileKeyMap[keyCode] || { key: '', code: '' };
                const event = new KeyboardEvent(type, {
                    bubbles: true,
                    cancelable: true,
                    key: mapping.key,
                    code: mapping.code,
                    keyCode,
                    which: keyCode
                });
                Object.defineProperty(event, 'keyCode', { get: () => keyCode });
                Object.defineProperty(event, 'which', { get: () => keyCode });
                return event;
            }

            function sendMobileKeyEvent(keyCode, type) {
                const event = createKeyboardEvent(type, keyCode);
                window.dispatchEvent(event);
                document.dispatchEvent(event);
            }

            function handleMobileControl(button, type) {
                const keyName = button.dataset.key;
                const keyCode = mobileControlKeys[keyName];
                if (!keyCode) return;
                button.classList.toggle('active', type === 'keydown');
                sendMobileKeyEvent(keyCode, type);
            }

            function setupMobileControls() {
                const toggleButton = document.getElementById('mobileControlsToggleButton');
                const controls = document.getElementById('mobile-controls');
                if (!toggleButton || !controls) return;

                toggleButton.addEventListener('click', () => {
                    const hidden = controls.classList.toggle('hidden');
                    controls.setAttribute('aria-hidden', hidden ? 'true' : 'false');
                });

                const buttons = controls.querySelectorAll('.mobile-control-button');
                buttons.forEach((button) => {
                    button.addEventListener('pointerdown', (event) => {
                        event.preventDefault();
                        handleMobileControl(button, 'keydown');
                    });
                    button.addEventListener('pointerup', (event) => {
                        event.preventDefault();
                        handleMobileControl(button, 'keyup');
                    });
                    button.addEventListener('pointercancel', (event) => {
                        event.preventDefault();
                        handleMobileControl(button, 'keyup');
                    });
                    button.addEventListener('pointerleave', (event) => {
                        event.preventDefault();
                        handleMobileControl(button, 'keyup');
                    });
                    button.addEventListener('contextmenu', (event) => event.preventDefault());
                });
            }

            window.addEventListener('resize', resizeGameCanvas);
            window.addEventListener('load', () => {
                resizeGameCanvas();
                setupMobileControls();
                if (typeof GameMaker_Init === 'function') {
                    GameMaker_Init();
                }
            });
        </script>
